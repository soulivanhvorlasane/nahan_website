<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A2540" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="350" cy="250" r="220" fill="url(#primaryGrad)" opacity="0.12" filter="url(#glow)" />
  <circle cx="560" cy="120" r="90" fill="#06B6D4" opacity="0.15" filter="url(#glow)" />

  <!-- Main Window Frame -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="40" width="600" height="400" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Window Header -->
    <path d="M50 56 A 16 16 0 0 1 66 40 L634 40 A 16 16 0 0 1 650 56 L650 85 L50 85 Z" fill="#0A2540" />
    <!-- Window Dots -->
    <circle cx="75" cy="62" r="5" fill="#EF4444" />
    <circle cx="93" cy="62" r="5" fill="#F59E0B" />
    <circle cx="111" cy="62" r="5" fill="#10B981" />
    <text x="140" y="66" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">Odoo 18 Enterprise - Nahan ERP Cloud (Laos)</text>
    <rect x="520" y="52" width="110" height="22" rx="11" fill="url(#primaryGrad)" />
    <text x="532" y="67" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">● LIVE SERVER</text>
  </g>

  <!-- Left Sidebar Mock -->
  <rect x="50" y="85" width="130" height="355" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
  <rect x="65" y="105" width="100" height="12" rx="4" fill="#E2E8F0" />
  <rect x="65" y="130" width="85" height="10" rx="3" fill="#CBD5E1" />
  <rect x="65" y="155" width="90" height="10" rx="3" fill="#4F46E5" opacity="0.8" />
  <rect x="65" y="180" width="75" height="10" rx="3" fill="#CBD5E1" />
  <rect x="65" y="205" width="95" height="10" rx="3" fill="#CBD5E1" />
  <rect x="65" y="230" width="80" height="10" rx="3" fill="#CBD5E1" />

  <!-- TaxRIS Integration Indicator in Sidebar -->
  <g transform="translate(65, 330)">
    <rect x="0" y="0" width="100" height="85" rx="8" fill="#0A2540" />
    <circle cx="20" cy="22" r="6" fill="#10B981" />
    <text x="32" y="25" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">TaxRIS API</text>
    <text x="10" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8">Lao Revenue Dept</text>
    <rect x="10" y="54" width="80" height="18" rx="4" fill="#10B981" />
    <text x="18" y="66" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="bold">SYNCHRONIZED</text>
  </g>

  <!-- Top Metric Cards -->
  <g transform="translate(200, 105)">
    <!-- Card 1: Revenue -->
    <rect x="0" y="0" width="135" height="75" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="12" y="22" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">REVENUE (LAK)</text>
    <text x="12" y="48" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">₭ 485.6M</text>
    <text x="12" y="64" fill="#10B981" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">↑ +24.8% vs last mo</text>

    <!-- Card 2: POS Orders -->
    <rect x="145" y="0" width="135" height="75" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="157" y="22" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">POS INVOICES</text>
    <text x="157" y="48" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">1,842</text>
    <text x="157" y="64" fill="#4F46E5" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">100% TaxRIS Valid</text>

    <!-- Card 3: Inventory Uptime -->
    <rect x="290" y="0" width="135" height="75" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="302" y="22" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">SYSTEM HEALTH</text>
    <text x="302" y="48" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">99.98%</text>
    <text x="302" y="64" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold">Odoo 18 Cloud</text>
  </g>

  <!-- Big Analytics Area Chart -->
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="425" height="215" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="16" y="26" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Business Growth &amp; Tax Sync Performance</text>
    
    <!-- Chart Grid -->
    <line x1="16" y1="60" x2="405" y2="60" stroke="#E2E8F0" stroke-dasharray="3 3" />
    <line x1="16" y1="105" x2="405" y2="105" stroke="#E2E8F0" stroke-dasharray="3 3" />
    <line x1="16" y1="150" x2="405" y2="150" stroke="#E2E8F0" stroke-dasharray="3 3" />
    <line x1="16" y1="190" x2="405" y2="190" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Chart Path -->
    <path d="M 25 170 Q 75 140, 120 150 T 210 110 T 300 70 T 395 45 L 395 190 L 25 190 Z" fill="url(#primaryGrad)" opacity="0.15" />
    <path d="M 25 170 Q 75 140, 120 150 T 210 110 T 300 70 T 395 45" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Glowing Data Points -->
    <circle cx="120" cy="150" r="5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="210" cy="110" r="5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="300" cy="70" r="5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="395" cy="45" r="7" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Tooltip Box on Last Data Point -->
    <g transform="translate(310, 15)">
      <rect x="0" y="0" width="95" height="32" rx="6" fill="#0A2540" />
      <text x="8" y="14" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8">SEPTEMBER 2026</text>
      <text x="8" y="26" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold">+42% E-Invoices</text>
    </g>
  </g>

  <!-- Floating Badge: Odoo 18 Ready -->
  <g transform="translate(20, 240)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="130" height="50" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" />
    <circle cx="25" cy="25" r="14" fill="#4F46E5" />
    <path d="M19 25 L23 29 L31 20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="22" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Odoo 18 Ready</text>
    <text x="46" y="37" fill="#64748B" font-family="-apple-system, sans-serif" font-size="9">Verified Architecture</text>
  </g>

  <!-- Floating Badge: BCEL One & LAPNet Banking -->
  <g transform="translate(530, 360)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="25" cy="26" r="14" fill="#06B6D4" />
    <text x="21" y="31" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="900">₭</text>
    <text x="46" y="23" fill="#0A2540" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold">Lao QR &amp; Banking</text>
    <text x="46" y="38" fill="#10B981" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">BCEL One / LAPNet</text>
  </g>
</svg>
